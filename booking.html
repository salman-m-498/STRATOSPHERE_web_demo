<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Session — Stratosphere</title>
  <meta name="description" content="Book pool tables, PS5 bays, car sims and more at Stratosphere.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" type="image/png" href="media/logo-512.png">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <nav class="mobile-nav" id="mobile-nav"></nav>

  <section class="section">
    <div class="container">
      <div class="section-head">
        <span class="eyebrow">Book</span>
        <h1>Book your session</h1>
        <p class="lead">Pick your activity, grab a time slot and lock it in. Members always pay less.</p>
      </div>

      <div class="booking-layout" id="booking-main">
        <!-- Left: booking form -->
        <div class="card" id="booking-main-form">
          <div class="mb-2">
            <span class="chip chip--gold mb-1">1 · Choose activity</span>
            <div id="category-filters" class="flex wrap gap-1 mt-1"></div>
            <select id="activity-select" class="input mt-2"></select>
          </div>

          <div class="mb-2">
            <span class="chip chip--gold mb-1">2 · Date & duration</span>
            <div class="grid grid--2 mt-1">
              <div class="form-group" style="margin:0;">
                <label for="date-input">Date</label>
                <input type="date" id="date-input" class="input">
              </div>
              <div class="form-group" style="margin:0;">
                <label for="duration-input">Duration</label>
                <select id="duration-input" class="input">
                  <option>1 hour</option>
                  <option>1.5 hours</option>
                  <option>2 hours</option>
                  <option>3 hours</option>
                </select>
              </div>
            </div>
          </div>

          <div class="mb-2">
            <span class="chip chip--gold mb-1">3 · Pick a time</span>
            <div id="slot-legend" class="legend"></div>
            <div id="slot-grid" class="slot-grid"></div>
          </div>
        </div>

        <!-- Right: summary -->
        <div class="summary-card card" id="summary"></div>
      </div>
    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/booking.js"></script>
</body>
</html>
