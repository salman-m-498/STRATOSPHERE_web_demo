<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account — Stratosphere</title>
  <meta name="description" content="Your Stratosphere dashboard.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" type="image/png" href="media/logo-512.png">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <nav class="mobile-nav" id="mobile-nav"></nav>

  <section class="section">
    <div class="container">
      <div id="account-root"></div>
    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const A = window.STRATOSPHERE;
      const user = window.Auth.getUser();
      const root = document.getElementById("account-root");

      if (!user) {
        root.innerHTML = `
          <div class="card center" style="padding:48px 24px;">
            <h2>You're not signed in</h2>
            <p class="lead">Log in to see your bookings, rewards and upcoming tournaments.</p>
            <div class="flex gap-2 wrap" style="justify-content:center;">
              <a href="login.html" class="btn btn--gold">Login</a>
              <a href="index.html" class="btn btn--ghost">Back home</a>
            </div>
          </div>`;
        return;
      }

      const tier = A.tiers[1];
      root.innerHTML = `
        <div class="profile-head">
          <div class="avatar">${user.firstName[0]}</div>
          <div>
            <h2>${user.firstName}</h2>
            <span class="chip chip--gold tier-chip">${tier.name} tier</span>
          </div>
          <a href="index.html" class="btn btn--ghost btn--sm" style="margin-left:auto;" id="logout-btn">Log out</a>
        </div>

        <div class="dash-stats mb-3">
          <div class="card dash-stat"><div class="num">${user.points.toLocaleString()}</div><div class="lbl">Reward points</div></div>
          <div class="card dash-stat"><div class="num">3</div><div class="lbl">Upcoming bookings</div></div>
          <div class="card dash-stat"><div class="num">2</div><div class="lbl">Tournaments joined</div></div>
        </div>

        <div class="grid grid--2">
          <div class="card">
            <h3 class="mb-2">Upcoming bookings</h3>
            ${[
              ["pool", "Pool Table", "Oct 16 · 7:00 PM · 2 hrs", "Confirmed"],
              ["sim", "Car Simulator", "Oct 18 · 5:00 PM · 1 session", "Confirmed"],
              ["ps5", "PS5 Arena", "Oct 21 · 8:00 PM · 1 hr", "Pending"],
            ].map(b => `
              <div class="flex-between mb-2" style="border-bottom:1px solid var(--border);padding-bottom:12px;">
                <div><strong>${window.ICON(b[0], "icon")} ${b[1]}</strong><div class="muted" style="font-size:.85rem;">${b[2]}</div></div>
                <span class="chip ${b[3] === "Confirmed" ? "chip--green" : "chip--amber"}">${b[3]}</span>
              </div>`).join("")}
            <a href="booking.html" class="btn btn--outline btn--sm btn--block">New booking</a>
          </div>

          <div class="card">
            <h3 class="mb-2">Favorite games</h3>
            <div class="flex wrap gap-1">
              ${[["pool", "Pool"], ["sim", "Car Sim"], ["ps5", "PS5"], ["snooker", "Snooker"]].map(g => `<span class="chip chip--cyan">${window.ICON(g[0], "icon")} ${g[1]}</span>`).join("")}
            </div>
            <h3 class="mt-3 mb-2">Upcoming tournaments</h3>
            ${A.tournaments.slice(0, 2).map(t => `
              <div class="flex-between mb-2" style="border-bottom:1px solid var(--border);padding-bottom:12px;">
                <div><strong>${t.name}</strong><div class="muted" style="font-size:.85rem;">${t.date} · ${t.time}</div></div>
                <span class="chip chip--gold">${t.prize}</span>
              </div>`).join("")}
            <a href="tournaments.html" class="btn btn--ghost btn--sm btn--block">Browse tournaments</a>
          </div>
        </div>
      `;

      document.getElementById("logout-btn").addEventListener("click", () => {
        window.Auth.clear();
        location.href = "index.html";
      });
    });
  </script>
</body>
</html>
